<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Contact RentChek support.">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
<title>Support · RentChek</title>
<style>
  /*
   * Chrome copied verbatim from legal/privacy.html -- see that file's
   * comments for how it was measured against the running app. Keep the
   * two in sync if that chrome ever changes.
   */
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ffffff;
    color: #2c3e50;
    font-family: 'Lato', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 26px;
  }
  a { color: #507192; text-decoration: none; }
  a:hover { color: #7997b5; }

  .brand-banner { display: block; background: #3498db; }
  .brand-bar { height: 80px; }
  .wordmark {
    margin: 0;
    padding: 22px 0 12px;
    text-align: center;
    font-family: sans-serif;
    font-size: 48px;
    line-height: 46px;
    font-weight: 700;
    color: #ffffff;
  }
  .house-notch { position: relative; height: 60px; overflow: hidden; }
  .roof {
    position: absolute;
    bottom: 0;
    left: 50%;
    margin-left: -60px;
    width: 0;
    height: 0;
    border-left: 60px solid transparent;
    border-right: 60px solid transparent;
    border-bottom: 60px solid #ffffff;
  }
  .chimney {
    position: absolute;
    bottom: 10px;
    left: 50%;
    margin-left: 28px;
    width: 17px;
    height: 30px;
    background: #ffffff;
  }

  main { max-width: 648px; margin: 0 auto; }
  .content { padding: 50px 15px; }

  .section-heading { position: relative; height: 36px; }
  .section-heading .rule {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: #dddddd;
  }
  .section-heading .heading-wrap {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
  }
  .section-heading h1 {
    margin: -21px 0 0;
    padding: 10px;
    background: #ffffff;
    font-family: sans-serif;
    font-size: 21.6px;
    line-height: 26px;
    font-weight: 400;
    color: #999999;
  }
  p { margin: 8px 0 0; }

  /* Matches ShareFooter.tsx's FOOTER_LINK exactly, same as privacy.html. */
  footer {
    padding: 10px 15px 55px;
    text-align: center;
    color: #507192;
    font-size: 12.8px;
  }
</style>
</head>
<body>
<a class="brand-banner" href="https://rentchek.com/" aria-label="RentChek home">
  <div class="brand-bar"><p class="wordmark">RentChek&#10003;</p></div>
  <div class="house-notch"><div class="roof"></div><div class="chimney"></div></div>
</a>
<main>
  <div class="content">
  <div class="section-heading">
    <div class="rule"></div>
    <div class="heading-wrap"><h1>Support</h1></div>
  </div>

  <p>
    Need help? Email us at <a href="mailto:chesley@rentchek.com">chesley@rentchek.com</a> and
    we'll get back to you as soon as we can.
  </p>
  </div>

  <footer>
    <a href="https://rentchek.com/terms">Terms of Service</a> / <a href="https://rentchek.com/privacy">Privacy Policy</a> / <a href="https://rentchek.com/acceptableuse">Acceptable Use Policy</a>
  </footer>
</main>
</body>
</html>
